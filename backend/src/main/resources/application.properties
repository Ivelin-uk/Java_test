spring.application.name=QuickTest
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:8889/test_ai?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:quicktest}
spring.datasource.password=${DATABASE_PASSWORD:quicktest}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.mvc.problemdetails.enabled=true

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.demo-seed=${DEMO_SEED:true}
app.subscription-zone=${SUBSCRIPTION_ZONE:Europe/Sofia}
app.ai.provider=${AI_PROVIDER:ollama}
app.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
app.ai.ollama.model=${OLLAMA_MODEL:qwen3:4b}
app.ai.ollama.timeout-seconds=${OLLAMA_TIMEOUT_SECONDS:180}
app.legacy-api.enabled=${LEGACY_API_ENABLED:false}
app.workspace.workers=${WORKSPACE_WORKERS:true}
app.exam.mobile-validated=${MOBILE_FULLSCREEN_VALIDATED:false}
server.servlet.session.cookie.secure=${SECURE_COOKIES:false}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.task.scheduling.pool.size=4
app.mail.adapter=${MAIL_ADAPTER:local}
app.google.enabled=${GOOGLE_ENABLED:false}
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.backend-url=${BACKEND_URL:http://localhost:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.billing.fixtures=${BILLING_FIXTURES:false}
app.mail.from=${MAIL_FROM:examai@localhost}
app.mail.allowed-domains=${MAIL_ALLOWED_DOMAINS:example.test,quicktest.local,examai.local}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_TLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000
