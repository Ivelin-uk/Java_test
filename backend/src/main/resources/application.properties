spring.application.name=QuickTest
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/test_ai?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:quicktest}
spring.datasource.password=${DATABASE_PASSWORD:quicktest}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.demo-seed=${DEMO_SEED:true}
