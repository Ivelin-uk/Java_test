spring.application.name=QuickTest
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:8889/test_ai?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:quicktest}
spring.datasource.password=${DATABASE_PASSWORD:quicktest}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.mvc.problemdetails.enabled=true

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.demo-seed=${DEMO_SEED:true}
app.subscription-zone=${SUBSCRIPTION_ZONE:Europe/Sofia}
app.ai.provider=${AI_PROVIDER:ollama}
app.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
app.ai.ollama.model=${OLLAMA_MODEL:qwen3:4b}
app.ai.ollama.timeout-seconds=${OLLAMA_TIMEOUT_SECONDS:180}
