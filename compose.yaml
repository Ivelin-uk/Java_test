services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: quicktest
      MYSQL_USER: quicktest
      MYSQL_PASSWORD: quicktest
      MYSQL_ROOT_PASSWORD: local-root-password
    ports:
      - "3306:3306"
    volumes:
      - quicktest_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uquicktest", "-pquicktest"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  quicktest_mysql_data:
