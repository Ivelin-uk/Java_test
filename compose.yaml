services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: test_ai
      MYSQL_USER: quicktest
      MYSQL_PASSWORD: quicktest
      MYSQL_ROOT_PASSWORD: local-root-password
    ports:
      - "${COMPOSE_MYSQL_PORT:-8890}:3306"
    volumes:
      - quicktest_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uquicktest", "-pquicktest"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    ports:
      - "${COMPOSE_API_PORT:-8082}:8080"
    environment:
      DATABASE_URL: jdbc:mysql://mysql:3306/test_ai?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DATABASE_USERNAME: quicktest
      DATABASE_PASSWORD: quicktest
      FRONTEND_URL: http://localhost:${COMPOSE_FRONTEND_PORT:-5174}
      BACKEND_URL: http://localhost:${COMPOSE_API_PORT:-8082}
      DEMO_SEED: "true"
      WORKSPACE_WORKERS: "true"
      LEGACY_API_ENABLED: "false"
      AI_PROVIDER: ${COMPOSE_AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-2.5-flare}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-180}
      MAIL_ADAPTER: ${COMPOSE_MAIL_ADAPTER:-local}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      GOOGLE_ENABLED: ${GOOGLE_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      STRIPE_MODE: ${STRIPE_MODE:-test}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRO_MONTH_PRICE_ID: ${STRIPE_PRO_MONTH_PRICE_ID:-}
      STRIPE_PRO_YEAR_PRICE_ID: ${STRIPE_PRO_YEAR_PRICE_ID:-}
      BILLING_FIXTURES: ${BILLING_FIXTURES:-false}
      BILLING_FREE_GROUP_LIMIT: ${BILLING_FREE_GROUP_LIMIT:-1}
      BILLING_FREE_ACTIVE_ASSIGNMENT_LIMIT: ${BILLING_FREE_ACTIVE_ASSIGNMENT_LIMIT:-5}
      BILLING_FREE_AI_CREDITS: ${BILLING_FREE_AI_CREDITS:-10}
      BILLING_PRO_GROUP_LIMIT: ${BILLING_PRO_GROUP_LIMIT:-20}
      BILLING_PRO_ACTIVE_ASSIGNMENT_LIMIT: ${BILLING_PRO_ACTIVE_ASSIGNMENT_LIMIT:-100}
      BILLING_PRO_AI_CREDITS: ${BILLING_PRO_AI_CREDITS:-100}
    depends_on:
      mysql:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:${COMPOSE_API_PORT:-8082}
    ports:
      - "${COMPOSE_FRONTEND_PORT:-5174}:80"
    depends_on:
      - backend
  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:${COMPOSE_SMTP_PORT:-1025}:1025"

volumes:
  quicktest_mysql_data:
